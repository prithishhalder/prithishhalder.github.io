name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website-docusaurus/package-lock.json

      - name: Install dependencies
        run: |
          cd website-docusaurus
          npm ci

      - name: Sync publications database
        run: |
          python3 database/manage_db.py sync
          cp database/publications.bib website-docusaurus/static/

      - name: Build website
        run: |
          cd website-docusaurus
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website-docusaurus/build

